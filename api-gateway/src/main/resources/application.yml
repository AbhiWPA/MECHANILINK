server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: mechanic-service
          uri: lb://MECHANIC-SERVICE
          predicates:
            - Path=/api/mechanics/**
          filters:
            - StripPrefix=0

        - id: merchant-service
          uri: lb://MERCHANT-SERVICE
          predicates:
            - Path=/api/merchants/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG