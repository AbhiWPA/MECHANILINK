server:
  port: 8085
  servlet:
    context-path: /api/users

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/mechani_link?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

logging:
  level:
    lk.ijse.userservice: DEBUG
    org.springframework.security: DEBUG
    org.springdoc: DEBUG

security:
  jwt:
    secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-time: 1440

# Swagger configuration - FIXED packages-to-scan
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: lk.ijse.userservice.controller  # ← FIXED: Correct package
  paths-to-match: /api/**, /auth/**  # ← FIXED: Added /auth paths